<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - Campus Hub</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" ></script>
  <script>
    try {
      const session = JSON.parse(localStorage.getItem("campushub_session"));
      if (session && session.role === "student") {
        window.location.replace("student-dashboard.html");
      }
    } catch (e) {
      console.error(e);
    }
  </script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-header">
        <h1 class="brand-title" style="font-size: 2.25rem;">Campus Hub</h1>
        <p class="auth-subtitle">Student Portal Login</p>
      </div>

      <div class="card">
        <form id="student-login-form" onsubmit="event.preventDefault(); handleLogin();">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="name@campushub.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">Sign In</button>
        </form>
      </div>

      <div class="auth-footer">
        <p>Don't have an account? <a href="student-register.html">Register here</a></p>
        <p style="margin-top: 1rem;"><a href="index.html" class="btn btn-outline" style="padding: 0.4rem 1rem; font-size: 0.8rem; width: auto; display: inline-flex;">← Back to Roles</a></p>
      </div>
    </div>
  </div>

  <script>
    function handleLogin() {
      const email = document.getElementById("login-email").value;
      const pass = document.getElementById("login-password").value;
      window.loginStudent(email, pass);
    }
  </script>
</body>
</html>
