<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Campus Hub</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" ></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-header">
        <h1 class="brand-title" style="font-size: 2.25rem;">Campus Hub</h1>
        <p class="auth-subtitle">Create Student Account</p>
      </div>

      <div class="card">
        <form id="student-register-form" onsubmit="event.preventDefault(); handleRegister();">
          <div class="form-group">
            <label class="form-label" for="reg-username">Full Name</label>
            <input type="text" id="reg-username" class="form-control" placeholder="Alex Rivera" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="alex@campushub.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="4" required>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">Register</button>
        </form>
      </div>

      <div class="auth-footer">
        <p>Already have an account? <a href="student-login.html">Login here</a></p>
        <p style="margin-top: 1rem;"><a href="index.html" class="btn btn-outline" style="padding: 0.4rem 1rem; font-size: 0.8rem; width: auto; display: inline-flex;">← Back to Roles</a></p>
      </div>
    </div>
  </div>

  <script>
    function handleRegister() {
      const name = document.getElementById("reg-username").value;
      const email = document.getElementById("reg-email").value;
      const pass = document.getElementById("reg-password").value;
      registerStudent(name, email, pass);
    }
  </script>
</body>
</html>
