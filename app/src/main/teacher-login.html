<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login - Campus Hub</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" type="module"></script>
  <script>
    try {
      const session = JSON.parse(localStorage.getItem("campushub_session"));
      if (session && session.role === "teacher") {
        window.location.replace("teacher-dashboard.html");
      }
    } catch (e) {
      console.error(e);
    }
  </script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-header">
        <h1 class="brand-title" style="font-size: 2.25rem;">Campus Hub</h1>
        <p class="auth-subtitle">Teacher Portal Login</p>
      </div>

      <div class="card">
        <form id="teacher-login-form" onsubmit="event.preventDefault(); handleLogin();">
          <div class="form-group">
            <label class="form-label" for="login-teacher-id">Teacher ID</label>
            <input type="text" id="login-teacher-id" class="form-control" placeholder="T-101" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-username">Username</label>
            <input type="text" id="login-username" class="form-control" placeholder="teacher" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">Sign In</button>
        </form>
      </div>

      <div class="auth-footer">
        <p>Don't have an account? <a href="teacher-register.html">Register here</a></p>
        <p style="margin-top: 1rem;"><a href="index.html" class="btn btn-outline" style="padding: 0.4rem 1rem; font-size: 0.8rem; width: auto; display: inline-flex;">← Back to Roles</a></p>
      </div>
    </div>
  </div>

  <script>
    function handleLogin() {
      const tid = document.getElementById("login-teacher-id").value;
      const user = document.getElementById("login-username").value;
      const pass = document.getElementById("login-password").value;
      window.loginTeacher(user, pass, tid);
    }
  </script>
</body>
</html>
